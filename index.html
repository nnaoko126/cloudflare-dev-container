  iconSize: [25, 41],

const translucentIcon = L.icon({

});


        results.data.forEach(row => {
          const lat = parseFloat(row["緯度"]);
          const lon = parseFloat(row["経度"]);
          if (isNaN(lat) || isNaN(lon)) return; // 座標がない行は飛ばす

          const popup =
            `<b>${esc(row["避難所名称"])}</b>（${esc(row["区"])}）` +
            `<table class="popup-table">` +
            `<tr><th>所在地</th><td>${esc(row["所在地"])}</td></tr>` +
            `<tr><th>電話</th><td>${esc(row["電話1"])}</td></tr>` +
            `<tr><th>収容可能人員</th><td>${esc(row["収容可能人員（屋内）"])}人</td></tr>` +
            `<tr><th>救護所</th><td>${esc(row["救護所"])}</td></tr>` +
            `<tr><th>開放区</th><td>${esc(row["開放区"])}</td></tr>` +
            `</table>`;

          markers.push({marker: L.marker([lat, lon], {icon: defaultIcon}).bindPopup(popup).addTo(map), data: row});
        });

        console.log("読み込み件数:", results.data.length, "／表示したマーカー:", markers.length);

// クリックイベント
let clickMarker = null;
map.on('click', function(e) {
  const clickLat = e.latlng.lat;
  const clickLon = e.latlng.lng;
  // クリック位置のピンを更新
  if (clickMarker) {
    clickMarker.setLatLng([clickLat, clickLon]);
  } else {
    clickMarker = L.marker([clickLat, clickLon], {icon: clickIcon}).addTo(map).bindPopup('クリック位置').openPopup();
  }
  findNearestShelters(clickLat, clickLon, results.data);
});

  // 距離計算（ハーベシーン公式）
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371; // 地球の半径（km）
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c; // 距離（km）
}

  shelters.forEach(shelter => {

        if (markers.length > 0) {
          map.fitBounds(L.featureGroup(markers).getBounds().pad(0.05));
