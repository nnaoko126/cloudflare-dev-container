<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>浜松市避難所マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; }
    #map { height: 100vh; }
    .popup-table { border-collapse: collapse; font-size: 13px; }
    .popup-table th { text-align: left; padding: 2px 8px 2px 0; color: #555; white-space: nowrap; vertical-align: top; }
    .popup-table td { padding: 2px 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    // 地図の初期化（CSVの読み込みに失敗しても地図は表示される）
    const map = L.map("map").setView([34.7966, 137.9361], 10);
    L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", {
      attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
      maxZoom: 18
    }).addTo(map);

    // HTMLエスケープ（ポップアップに安全に文字を入れるため）
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // CSVはShift-JIS（CP932）なので、fetchで読み込んでから復号する
    fetch("ori-data/221309_hamamatsu_hinanjyo.csv")
      .then(res => {
        if (!res.ok) throw new Error("CSVが見つかりません: HTTP " + res.status);
        return res.arrayBuffer();
      })
      .then(buf => {
        const text = new TextDecoder("shift-jis").decode(buf);
        const results = Papa.parse(text, { header: true, skipEmptyLines: true });
        const markers = []; // array of {marker, data}

// CSVデータのフィールド名を正しく設定
const CSV_FIELDS = {
  name: '避難所名称',
  lat: '緯度',
  lon: '経度',
  area: '区',
  address: '所在地',
  phone: '電話1',
  capacity: '収容可能人員（屋内）',
  firstAid: '救護所',
  openArea: '開放区'
};

// アイコン定義
const defaultIcon = L.icon({
  iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
const clickIcon = L.icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
  shadowSize: [41, 41]
});


results.data.forEach(row => {
  const lat = parseFloat(row[CSV_FIELDS.lat]);
          const lon = parseFloat(row["経度"]);
          if (isNaN(lat) || isNaN(lon)) return; // 座標がない行は飛ばす

          const popup =
            `<b>${esc(row["避難所名称"])}</b>（${esc(row["区"])}）` +
            `<table class="popup-table">` +
            `<tr><th>所在地</th><td>${esc(row["所在地"])}</td></tr>` +
            `<tr><th>電話</th><td>${esc(row["電話1"])}</td></tr>` +
            `<tr><th>収容可能人員</th><td>${esc(row["収容可能人員（屋内）"])}人</td></tr>` +
            `<tr><th>救護所</th><td>${esc(row["救護所"])}</td></tr>` +
            `<tr><th>開放区</th><td>${esc(row["開放区"])}</td></tr>` +
            `</table>`;

          markers.push({marker: L.marker([lat, lon], {icon: defaultIcon}).bindPopup(popup).addTo(map), data: {
    name: row[CSV_FIELDS.name],
    lat: lat,
    lon: lon,
    area: row[CSV_FIELDS.area],
    address: row[CSV_FIELDS.address],
    phone: row[CSV_FIELDS.phone],
    capacity: row[CSV_FIELDS.capacity],
    firstAid: row[CSV_FIELDS.firstAid],
    openArea: row[CSV_FIELDS.openArea]
  }});
        });

        console.log("読み込み件数:", results.data.length, "／表示したマーカー:", markers.length);

// クリックイベント
let clickMarker = null;
map.on('click', function(e) {
  const clickLat = e.latlng.lat;
  const clickLon = e.latlng.lng;
  // クリック位置のピンを更新
  if (clickMarker) {
    clickMarker.setLatLng([clickLat, clickLon]);
  } else {
    clickMarker = L.marker([clickLat, clickLon], {icon: clickIcon}).addTo(map).bindPopup('クリック位置').openPopup();
  }
  findNearestShelters(clickLat, clickLon, markers.map(m => m.data));
});

  // 距離計算（ハーベシーン公式）
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371; // 地球の半径（km）
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c; // 距離（km）
}

// 最寄りの避難所を検索
function findNearestShelters(lat, lon, shelters) {
  // 距離を計算して最寄りの3件を取得
  const results = shelters.map(shelter => {
    const distance = haversine(lat, lon, shelter.lat, shelter.lon);
    return { ...shelter, distance };
  });
  
  // 距離でソートして上位3件を取得
  results.sort((a, b) => a.distance - b.distance);
  const nearest = results.slice(0, 3);
  
  // ルート描画
  console.log('最寄り3件:', nearest.map(n => n.name + ' ' + n.distance.toFixed(2) + 'km'));
  drawRoutes(nearest, lat, lon);
}

// ルート表示用レイヤー（クリックのたびに前回分を消す）
const routeLayer = L.layerGroup().addTo(map);
let routeRequestId = 0;
const ROUTE_COLORS = ['#d32f2f', '#1976d2', '#388e3c'];

// 徒歩ルートを取得（失敗したら例外）
async function fetchWalkingRoute(lat1, lon1, lat2, lon2) {
  const url = `https://routing.openstreetmap.de/routed-foot/route/v1/foot/${lon1},${lat1};${lon2},${lat2}?overview=full&geometries=geojson`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  if (!json.routes || !json.routes.length) throw new Error("ルートなし");
  return json.routes[0]; // {geometry, distance(m), duration(秒)}
}

// ルートを描画
async function drawRoutes(shelters, clickLat, clickLon) {
  const myId = ++routeRequestId;
  routeLayer.clearLayers();

  const routes = await Promise.all(shelters.map(s =>
    fetchWalkingRoute(clickLat, clickLon, s.lat, s.lon).catch(err => {
      console.error("ルート取得失敗（直線で代替）:", s.name, err);
      return null;
    })
  ));
  if (myId !== routeRequestId) return; // 後からクリックされていたら古い結果は捨てる

  const bounds = L.latLngBounds([[clickLat, clickLon]]);
  shelters.forEach((s, i) => {
    const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
    const r = routes[i];
    let info;
    if (r) {
      L.geoJSON(r.geometry, { style: { color, weight: 5, opacity: 0.8 } }).addTo(routeLayer);
      info = `徒歩 約${Math.round(r.duration / 60)}分／${(r.distance / 1000).toFixed(2)} km`;
    } else {
      L.polyline([[clickLat, clickLon], [s.lat, s.lon]], { color, weight: 4, dashArray: '8 8' }).addTo(routeLayer);
      info = `直線距離 ${s.distance.toFixed(2)} km（ルート取得不可）`;
    }
    L.marker([s.lat, s.lon], { icon: defaultIcon }).addTo(routeLayer)
      .bindPopup(`<b>${i + 1}. ${esc(s.name)}</b>（${esc(s.area)}）<br>${info}`);
    bounds.extend([s.lat, s.lon]);
  });
  map.fitBounds(bounds.pad(0.2));
}

        // 全マーカーが入る範囲に地図を合わせる
        if (markers.length > 0) {
          map.fitBounds(L.featureGroup(markers.map(m => m.marker)).getBounds().pad(0.05));
        }
      })
      .catch(err => console.error("CSV読み込み失敗:", err));
  </script>
</body>
</html>
